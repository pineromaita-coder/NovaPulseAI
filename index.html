<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Maita Nova IA</title>
<meta name="theme-color" content="#00d4ff">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:radial-gradient(circle at top,#07131d,#01060c);color:#fff}
.app{max-width:390px;margin:auto;min-height:100vh;padding:22px 18px 90px;display:flex;flex-direction:column;align-items:center}
.reactor{position:relative;width:180px;height:180px;margin:10px 0 25px}
.ring,.ring2,.core{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%}
.ring{width:125px;height:125px;border:3px solid #00d4ff;animation:spin 5s linear infinite}
.ring2{width:180px;height:180px;border:3px dashed rgba(0,212,255,.25);animation:spin2 8s linear infinite}
.core{width:80px;height:80px;background:radial-gradient(circle,#9efcff,#00d4ff,#0050aa);box-shadow:0 0 40px #00d4ff;animation:pulse 2s infinite}
h1{font-size:34px;color:#8fdfff;text-shadow:0 0 18px cyan;margin-bottom:8px}
#estado{color:#9fdfff;margin-bottom:16px}
#clock{font-size:28px;font-weight:bold;margin-bottom:22px}
.prices{width:100%;display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.card{background:#081825;border:1px solid rgba(0,212,255,.25);border-radius:20px;padding:16px;display:flex;justify-content:space-between;align-items:center}
#mainButton{width:100%;height:60px;border:none;border-radius:20px;background:linear-gradient(135deg,#00d4ff,#006eff);color:#fff;font-size:20px;font-weight:bold;box-shadow:0 0 25px rgba(0,212,255,.45)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;height:72px;background:#07131d;border-top:1px solid rgba(0,212,255,.25);display:flex;justify-content:space-around;align-items:center}
.nav-btn{background:none;border:none;color:#8fdfff;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-btn.active{color:#00d4ff;text-shadow:0 0 10px #00d4ff}
.chat{position:fixed;left:0;right:0;bottom:-100%;height:76vh;background:#07131d;border-radius:24px 24px 0 0;transition:.35s;display:flex;flex-direction:column;z-index:1000}
.chat.show{bottom:72px}
.chat-top{display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid rgba(0,212,255,.2)}
.chat-top button{background:none;border:none;color:#fff;font-size:22px}
.chat-msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bot,.user{padding:12px 16px;border-radius:18px;max-width:82%}
.bot{background:#0f2233}
.user{background:#00d4ff;color:#001018;align-self:flex-end}
.chat-send{display:flex;gap:10px;padding:16px}
.chat-send input{flex:1;padding:14px;border:none;border-radius:14px;background:#0f2233;color:#fff}
.chat-send button{width:52px;border:none;border-radius:14px;background:#00d4ff;font-size:18px}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes spin2{to{transform:translate(-50%,-50%) rotate(-360deg)}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 60px cyan}}
</style>
</head>

<body>

<main class="app">

<div class="reactor">
<div class="ring"></div>
<div class="ring2"></div>
<div class="core"></div>
</div>

<h1>Maita Nova IA</h1>
<p id="estado">MaitaCore ONLINE</p>

<div id="clock">00:00:00</div>

<div class="prices">
<div class="card"><span>₿ BTC</span><strong id="btc">...</strong></div>
<div class="card"><span>⟠ ETH</span><strong id="eth">...</strong></div>
<div class="card"><span>🔶 BNB</span><strong id="bnb">...</strong></div>
</div>

<button id="mainButton">🚀 Activar MaitaCore</button>

</main>

<nav class="bottom-nav">
<button class="nav-btn active">🏠<span>Inicio</span></button>
<button class="nav-btn" id="openChat">💬<span>Chat</span></button>
<button class="nav-btn">📈<span>Mercado</span></button>
<button class="nav-btn">⚙️<span>Operador</span></button>
</nav>

<div id="chat" class="chat">

<div class="chat-top">
<span>🤖 MaitaCore</span>
<button id="closeChat">✕</button>
</div>

<div id="msgs" class="chat-msgs">
<div class="bot">Hola David. Soy MaitaCore. Pregúntame cualquier cosa.</div>
</div>

<div class="chat-send">
<input id="txt" placeholder="Escribe aquí...">
<button id="send">➤</button>
</div>

</div>

<script>
const API="https://nova-pulse-ai-1--pineromaita.replit.app";

const clock=document.getElementById("clock");
const estado=document.getElementById("estado");
const btc=document.getElementById("btc");
const eth=document.getElementById("eth");
const bnb=document.getElementById("bnb");
const boton=document.getElementById("mainButton");

const chat=document.getElementById("chat");
const msgs=document.getElementById("msgs");
const txt=document.getElementById("txt");

function reloj(){
clock.textContent=new Date().toLocaleTimeString("es-ES");
}
reloj();
setInterval(reloj,1000);

async function mercado(){
try{
const r=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,binancecoin&vs_currencies=usd");
const d=await r.json();
btc.textContent="$"+d.bitcoin.usd.toLocaleString();
eth.textContent="$"+d.ethereum.usd.toLocaleString();
bnb.textContent="$"+d.binancecoin.usd.toLocaleString();
}catch{
btc.textContent="Error";
eth.textContent="Error";
bnb.textContent="Error";
}
}
mercado();
setInterval(mercado,30000);

boton.onclick=async()=>{
boton.disabled=true;
const pasos=[
"Inicializando MaitaCore...",
"Escaneando sistema...",
"Conectando Internet...",
"Operador autorizado.",
"MaitaCore ACTIVO"
];
for(const p of pasos){
estado.textContent=p;
await new Promise(r=>setTimeout(r,700));
}
boton.innerHTML="✅ Sistema Activo";
boton.disabled=false;
if("speechSynthesis" in window){
const voz=new SpeechSynthesisUtterance("Operador David autorizado. MaitaCore activo.");
voz.lang="es-ES";
speechSynthesis.speak(voz);
}
};

document.getElementById("openChat").onclick=()=>chat.classList.add("show");
document.getElementById("closeChat").onclick=()=>chat.classList.remove("show");

function agregar(clase,texto){
const d=document.createElement("div");
d.className=clase;
d.textContent=texto;
msgs.appendChild(d);
msgs.scrollTop=msgs.scrollHeight;
}

async function responder(){

const pregunta=txt.value.trim();
if(!pregunta)return;

agregar("user",pregunta);
txt.value="";
agregar("bot","🌐 Buscando en Internet...");

try{
const r=await fetch(API+"/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:pregunta})
});

const data=await r.json();
msgs.lastChild.textContent=data.reply;

}catch(e){
msgs.lastChild.textContent="No pude conectarme a MaitaCore.";
console.log(e);
}
}

document.getElementById("send").onclick=responder;
txt.addEventListener("keydown",e=>{
if(e.key==="Enter")responder();
});
</script>

</body>
</html>
