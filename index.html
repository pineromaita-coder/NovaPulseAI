<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NovaPulse AI | JARVIS</title>

  <meta name="theme-color" content="#00d4ff">
  <meta name="description" content="NovaPulse AI - Sistema JARVIS">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="v3.css">
  <link rel="stylesheet" href="v4.css">
  <link rel="stylesheet" href="chat.css">
</head>

<body>

  <!-- Fondo -->
  <div class="grid"></div>

  <!-- Interfaz principal -->
  <main class="hud">

    <!-- Reactor central -->
    <section class="reactor">

      <div class="radar"></div>

      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>

      <div class="core">
        <div class="eye"></div>
      </div>

    </section>

    <!-- Identidad -->
    <h1>NovaPulse AI</h1>

    <p>JARVIS ONLINE</p>

    <!-- Reloj -->
    <div id="clock">00:00:00</div>

    <!-- Mercado -->
    <section class="prices">

      <div>
        ₿ BTC
        <span id="btc">Cargando...</span>
      </div>

      <div>
        ⟠ ETH
        <span id="eth">Cargando...</span>
      </div>

      <div>
        🔶 BNB
        <span id="bnb">Cargando...</span>
      </div>

    </section>

    <!-- Botón IA -->
    <button onclick="iniciarIA()">
      🚀 Iniciar IA
    </button>

  </main>

  <!-- Módulos NovaPulse -->

  <script src="market.js"></script>
  <script src="radar.js"></script>
  <script src="voice.js"></script>
  <script src="particles.js"></script>
  <script src="terminal.js"></script>
  <script src="sidepanel.js"></script>
  <script src="jarvis.js"></script>
  <script src="loader.js"></script>
  <script src="chat.js"></script>
  <script src="app.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js")
          .then(() => {
            console.log("🚀 NovaPulse Service Worker activo");
          })
          .catch((error) => {
            console.log("Service Worker:", error);
          });
      });
    }
  </script>

</body>
</html>
